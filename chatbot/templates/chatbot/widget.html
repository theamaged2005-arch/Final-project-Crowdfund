{% load static %}
<style>
#chatbot-widget {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 1050;
    width: 320px;
    font-family: inherit;
}
#chatbot-toggle {
    border-radius: 50%;
    width: 56px;
    height: 56px;
    font-size: 24px;
}
#chatbot-panel {
    display: none;
    height: 420px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    overflow: hidden;
    flex-direction: column;
    border: 1px solid #ddd;
}
#chatbot-header {
    background: #0d6efd;
    color: white;
    padding: 10px 14px;
    font-weight: bold;
}
#chatbot-messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    background: #f9f9fb;
}
.chat-bubble {
    padding: 8px 12px;
    border-radius: 14px;
    margin-bottom: 8px;
    max-width: 85%;
    font-size: 0.9rem;
    word-wrap: break-word;
}
.chat-bubble.user {
    background: #0d6efd;
    color: white;
    margin-left: auto;
}
.chat-bubble.bot {
    background: #eef0f3;
    color: #222;
}
#chatbot-input-row {
    display: flex;
    border-top: 1px solid #ddd;
}
#chatbot-input {
    flex: 1;
    border: none;
    padding: 10px;
    outline: none;
}
#chatbot-send {
    border: none;
    background: #0d6efd;
    color: white;
    padding: 0 16px;
    cursor: pointer;
}
</style>

<div id="chatbot-widget">
    <div id="chatbot-panel">
        <div id="chatbot-header">Crowdfund EG Assistant</div>
        <div id="chatbot-messages">
            <div class="chat-bubble bot">Hi! Ask me how to register, donate, create a project, or anything else about the site.</div>
        </div>
        <div id="chatbot-input-row">
            <input type="text" id="chatbot-input" placeholder="Type your question...">
            <button id="chatbot-send">Send</button>
        </div>
    </div>
    <button id="chatbot-toggle" class="btn btn-primary">💬</button>
</div>

<script>
(function() {
    const toggle = document.getElementById('chatbot-toggle');
    const panel = document.getElementById('chatbot-panel');
    const input = document.getElementById('chatbot-input');
    const sendBtn = document.getElementById('chatbot-send');
    const messages = document.getElementById('chatbot-messages');

    toggle.addEventListener('click', function() {
        panel.style.display = (panel.style.display === 'flex') ? 'none' : 'flex';
        if (panel.style.display === 'flex') input.focus();
    });

    function addBubble(text, sender) {
        const div = document.createElement('div');
        div.className = 'chat-bubble ' + sender;
        div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    function sendMessage() {
        const text = input.value.trim();
        if (!text) return;
        addBubble(text, 'user');
        input.value = '';

        fetch("{% url 'chatbot:ask' %}", {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: text})
        })
        .then(response => response.json())
        .then(data => {
            addBubble(data.answer || "Sorry, something went wrong.", 'bot');
        })
        .catch(() => {
            addBubble("Sorry, I couldn't reach the server.", 'bot');
        });
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });
})();
</script>
