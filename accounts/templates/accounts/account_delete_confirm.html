{% extends 'base.html' %}
{% block title %}Delete Account{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h3 class="text-danger">Delete your account</h3>
    <p>This action is <strong>permanent</strong> and cannot be undone. All your data will be lost.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-danger">Yes, permanently delete my account</button>
      <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
