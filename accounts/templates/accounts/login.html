{% extends 'base.html' %}
{% block title %}Login - Crowdfund EG{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <h3>Login</h3>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <p class="mt-3">No account? <a href="{% url 'accounts:register' %}">Register</a></p>
    <p><a href="{% url 'accounts:password_reset_request' %}">Forgot your password?</a></p>
  </div>
</div>
{% endblock %}
